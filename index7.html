<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCS_software | Terminal QR Code Bradesco</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #facc15; /* AMARELO MERCADO LIVRE */
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border: 3px solid #000000;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }
        .badge-seguro {
            background-color: #3483fa;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 6px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: block;
        }
        .qr-moldura {
            border: 2px solid #000000;
            padding: 10px;
            background: #ffffff;
            display: inline-block;
            margin: 10px 0;
        }
        .qr-imagem-real {
            width: 250px;
            height: 250px;
            display: block;
        }
        .valor-neon {
            font-size: 32px;
            font-weight: bold;
            color: #15803d;
            margin: 10px 0;
        }
        .btn-retornar {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #cc092f;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            text-decoration: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="badge-seguro">🛡️ LIQUIDAÇÃO DIRETA BRADESCO VIA BCB</div>
    
    <div style="font-size: 14px; font-weight: bold; text-transform: uppercase; color: #475569;">Aponte a Câmera do Celular:</div>
    
    <div class="qr-moldura">
        <img src="https://github.io" class="qr-imagem-real" onerror="this.src='https://imgur.com'" alt="QR Code Bradesco">
    </div>

    <div style="font-size: 11px; opacity: 0.8;">VALOR DO FATURAMENTO DETECTADO:</div>
    <div class="valor-neon" id="lblValorQR">R\$: 0,00</div>

    <!-- BOTÃO COM DIRECIONAMENTO FÍSICO CONTRA SUMIÇO DE PÁGINAS -->
    <button class="btn-retornar" onclick="voltarParaCheckoutSeguro()">⬅️ Voltar ao Checkout</button>
</div>

<script>
    let vMestre = "60.00";
    let dMestre = "uso de jcs_software mensal";
    let lMestre = "MAIRIPORÃ RAÇÕES";
    let pMestre = "RODRIGO";

    function extrairPrecoUniversal() {
        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.has('valor')) vMestre = urlParams.get('valor');
        if (urlParams.has('desc')) dMestre = urlParams.get('desc');
        if (urlParams.has('loja')) lMestre = urlParams.get('loja');
        if (urlParams.has('parceiro')) pMestre = urlParams.get('parceiro');
        
        document.getElementById('lblValorQR').innerText = "R\$: " + parseFloat(vMestre).toFixed(2).replace('.', ',');
    }

    function voltarParaCheckoutSeguro() {
        // Força a volta transportando a fiação de dados limpa
        window.location.href = `index1.html?valor=${vMestre}&desc=${encodeURIComponent(dMestre)}&loja=${encodeURIComponent(lMestre)}&parceiro=${encodeURIComponent(pMestre)}`;
    }

    window.onload = function() {
        extrairPrecoUniversal();
    }
</script>
</body>
</html>
