<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCS_software | Maquininha Digital Livre</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #cc092f; /* VERMELHO CLÁSSICO */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #cc092f;
            padding: 30px;
            border: 2px solid #ffffff;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 { color: #ffffff; margin-bottom: 5px; font-size: 24px; }
        .slogan-forte { 
            color: #5eff5e; 
            font-size: 13px; 
            font-weight: bold; 
            margin-bottom: 20px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }
        
        .status-bar {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .campo-faturamento {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-bottom: 20px;
        }
        
        label {
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .input-valor {
            width: 100%;
            padding: 12px;
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            background-color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 15px;
        }

        .input-desc {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            color: #000000;
            background-color: #ffffff;
            border: none;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 5px;
        }

        .btn-lancar {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #5eff5e;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>JCS_software</h2>
    <div class="slogan-forte">"Não estamos vendendo nada, estamos te dando crédito"</div>
    
    <div class="status-bar">
        <span>● Terminal Digital Ativo</span>
        <span id="relogioDigital">Carregando data...</span>
    </div>
    
    <div class="campo-faturamento">
        <label>Digite o Valor do Faturamento (R$):</label>
        <!-- ADICIONADO O MINIMO DE 2.00 DIRETO NO CAMPO -->
        <input type="number" class="input-valor" id="txtValorLancado" placeholder="0,00" step="0.01" min="2.00" value="20.00">
        
        <label>Descrição do Produto / Insumo:</label>
        <input type="text" class="input-desc" id="txtDescLancada" placeholder="Ex: Saco de Ração, Ferramentas, Mel...">
    </div>

    <button class="btn-lancar" onclick="lancarMaquininhaInvisivel()">Gerar Cobrança Instantânea ➔</button>
</div>

<script>
    let lojaGlobal = "MAIRIPORÃ RAÇÕES";

    function extrairNomeLoja() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('loja')) {
            lojaGlobal = decodeURIComponent(urlParams.get('loja'));
        }
    }

    function lancarMaquininhaInvisivel() {
        const valor = parseFloat(document.getElementById('txtValorLancado').value) || 0.00;
        let desc = document.getElementById('txtDescLancada').value || "Faturamento Geral Simplificado";
        
        // TRAVA PROTOCOLAR DE CRÉDITO MÍNIMO DE R$: 2,00
        if (valor < 2.00) {
            alert("❌ OPERAÇÃO RECUSADA: O valor mínimo protocolar para faturamento no JCS_software é de R$: 2,00!");
            return;
        }

        const descFormatada = `${desc} - R$: ${valor.toFixed(2).replace('.', ',')}`;

        // Envia os dados higienizados para o Pix amarelo (index1)
        window.location.href = "index1.html?valor=" + valor + "&desc=" + encodeURIComponent(descFormatada) + "&loja=" + encodeURIComponent(lojaGlobal);
    }

    function atualizarRelogio() {
        const agora = new Date();
        const dia = String(agora.getDate()).padStart(2, '0');
        const mes = String(agora.getMonth() + 1).padStart(2, '0');
        const ano = agora.getFullYear();
        document.getElementById('relogioDigital').innerText = `${dia}/${mes}/${ano} - ${String(agora.getHours()).padStart(2, '0')}:${String(agora.getMinutes()).padStart(2, '0')}:${String(agora.getSeconds()).padStart(2, '0')}`;
    }
    
    extrairNomeLoja();
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();
</script>
</body>
</html>
