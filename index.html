<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCS_software | Ecossistema Digital Unificado</title>
    <style>
        /* CONFIGURAÇÃO DO FLUXO DE ROLAGEM CONTINUA */
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            background-color: #212529; /* FUNDO BASE ESCURO */
            color: #ffffff;
        }

        /* 🔴 TELA 1: PORTAL MÃE & TERMINAL (VERMELHO FERRARI) */
        .secao-terminal {
            background-color: #b91c1c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .container-terminal {
            background: #991b1b;
            padding: 35px;
            border: 3px solid #facc15;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
        }
        .bloco-logos { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 15px; }
        .logo-parceria { width: 90px; height: auto; }
        .logo-maos-azuis { width: 75px; height: auto; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.2)); }
        h2 { font-size: 28px; margin: 0 0 5px 0; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
        .slogan { color: #4ade80; font-size: 13px; font-weight: bold; margin-bottom: 25px; text-transform: uppercase; }
        .status-bar { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 8px; padding: 10px; font-size: 11px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .login-box { background: rgba(0, 0, 0, 0.15); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; padding: 25px; text-align: left; margin-bottom: 20px; }
        label { font-size: 11px; font-weight: bold; display: block; margin-bottom: 8px; text-transform: uppercase; color: #facc15; }
        .input-vip { width: 100%; padding: 12px; font-size: 14px; color: #000000; background-color: #ffffff; border: none; border-radius: 8px; box-sizing: border-box; margin-bottom: 18px; font-weight: bold; }
        .input-valor { width: 100%; padding: 14px; font-size: 28px; font-weight: 900; color: #166534; background-color: #ffffff; border: 3px solid #4ade80; border-radius: 8px; box-sizing: border-box; text-align: center; margin-bottom: 18px; }
        .tarja-cadeado { background: #000000; color: #ff3333; border: 1px solid #ff3333; font-size: 10px; font-family: monospace; padding: 12px; border-radius: 8px; margin-bottom: 5px; text-align: justify; line-height: 1.4; }
        .bloco-botoes-mestre { display: flex; flex-direction: column; gap: 14px; }
        .btn-mestre { width: 100%; padding: 16px; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }

        /* 🔘 INTERMEDIÁRIO DE TRANSIÇÃO (INVISÍVEL OU SLIDE ESPERANDO ATIVAÇÃO) */
        .visor-dinamico { display: none; min-height: 100vh; width: 100%; flex-direction: column; align-items: center; padding: 25px; box-sizing: border-box; }

        /* 🔘 TELA 2: VISOR DO BOLETO VIP (CINZA GRAFITE) */
        #secaoBoleto { background-color: #212529; }
        .pdf-toolbar { background-color: #343a40; color: #ffffff; width: 100%; max-width: 680px; padding: 12px 20px; border-radius: 6px 6px 0 0; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; font-size: 13px; border-bottom: 2px solid #1a1a1a; font-family: sans-serif; }
        .pdf-page { background-color: #ffffff; color: #000000; width: 100%; max-width: 680px; padding: 30px; box-sizing: border-box; border-radius: 0 0 6px 6px; border: 1px solid #000000; font-family: "Courier New", monospace; }
        .topo-boleto { display: flex; align-items: center; border-bottom: 4px solid #000000; padding-bottom: 10px; margin-bottom: 20px; }
        .banco-logo { font-size: 24px; font-weight: 900; padding-right: 18px; border-right: 3px solid #000000; text-transform: uppercase; color: #cc092f; }
        .banco-codigo { font-size: 20px; font-weight: 900; padding: 0 18px; border-right: 3px solid #000000; }
        .linha-digitavel { font-size: 14px; font-weight: bold; padding-left: 10px; flex: 1; text-align: right; letter-spacing: 0.5px; word-break: break-all; }
        .tabela-boleto { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .tabela-boleto td { border: 1px solid #000000; padding: 8px 12px; font-size: 12px; vertical-align: top; }
        .tabela-boleto td span { display: block; font-size: 9px; font-weight: bold; color: #495057; text-transform: uppercase; margin-bottom: 4px; }
        .qr-moldura { border: 2px solid #000000; padding: 12px; background: #ffffff; display: inline-block; margin-top: 12px; }
        .qr-imagem-real { width: 220px; height: 220px; display: block; }
        .tarja-autenticacao-boleto { font-size: 11px; font-weight: bold; text-align: center; background: #fff159; padding: 10px; margin-top: 20px; border: 1px solid #000000; text-transform: uppercase; }

        /* 🟢 TELA 3: CÉDULA DE DUPLICATA SOBERANA (VERDE ESMERALDA) */
        #secaoDuplicata { background-color: #065f46; font-family: "Courier New", monospace; }
        .container-duplicata { background: #065f46; border: 4px solid #facc15; border-radius: 12px; padding: 25px; width: 100%; max-width: 580px; box-sizing: border-box; }
        .seletor-prazo { background: #000000; border: 2px solid #facc15; color: #fff; padding: 12px; width: 100%; border-radius: 6px; font-size: 14px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; outline: none; }
        .painel-amortizacao { background: #fff159; border: 2px dashed #000000; color: #000000; border-radius: 8px; padding: 15px; margin-bottom: 20px; text-align: left; }
        .input-bico { width: 130px; padding: 8px; font-size: 16px; font-weight: 900; border: 2px solid #000000; border-radius: 6px; text-align: center; margin-left: 15px; color: #166534; background: #ffffff; }
        .via-cedula { background: #ffffff; color: #000000; border: 3px double #000000; padding: 20px; margin-bottom: 20px; text-align: left; position: relative; }
        .via-tag { position: absolute; top: 8px; right: 12px; font-size: 11px; font-weight: 900; text-transform: uppercase; border: 2px solid #000000; padding: 2px 8px; background: #facc15; }
        .titulo-timbre { font-size: 14px; font-weight: bold; text-align: center; border-bottom: 2px dashed #000000; padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; }
        .linha-dados { font-size: 13px; margin: 6px 0; display: flex; justify-content: space-between; border-bottom: 1px dashed #e2e8f0; padding-bottom: 4px; }
        .painel-moeda-troca { background: #eff6ff; color: #1e3a8a; border-left: 5px solid #3b82f6; padding: 12px; font-size: 11px; margin-top: 15px; font-weight: bold; line-height: 1.5; }
        .tarja-autenticacao-duplicata { margin-top: 15px; border-top: 2px solid #000000; padding-top: 8px; font-size: 9px; font-weight: bold; text-align: center; background: #f1f5f9; text-transform: uppercase; }
        .bloco-botoes-duplicata { display: flex; gap: 12px; margin-top: 20px; }
        .btn-print-dup { flex: 2; padding: 16px; background-color: #facc15; color: #000000; border: none; border-radius: 6px; font-size: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-voltar-dup { flex: 1; padding: 16px; background-color: #dc2626; color: #ffffff; border: none; border-radius: 6px; font-size: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase; text-align: center; }

        .btn-pdf-topo { padding: 8px 16px; background-color: #dc3545; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 12px; font-family: -apple-system, sans-serif; }

        /* REGRAS REGULAMENTARES DE IMPRESSÃO COMPLETA */
        @media print {
            .secao-terminal, .pdf-toolbar, .seletor-prazo, .painel-amortizacao, .bloco-botoes-duplicata, .linha-corte { display: none !important; }
            .visor-dinamico { display: flex !important; min-height: auto; padding: 0; }
            #secaoBoleto, #secaoDuplicata { background: transparent !important; }
            .pdf-page, .container-duplicata { box-shadow: none !important; border: none !important; max-width: 100%; padding: 0; }
            .via-cedula { border: 4px double #000000 !important; page-break-inside: avoid; margin-bottom: 40px; }
        }
    </style>
</head>
<body>

        <div class="container-terminal">
            <div class="bloco-logos">
                <img src="png" class="logo-parceria" onerror="this.src='https://imgur.com'" alt="Logo JCS_software">

            </div>

                <span style="color: #ff4500;">⚡ VALIDADOR INDICADO</span>
                <span style="color: #facc15;">✔ CANAL CORPORATIVO</span>
            </div>
            
            <div class="login-box">
                <div class="status-bar" style="margin-bottom: 20px; background: rgba(0,0,0,0.5);">
