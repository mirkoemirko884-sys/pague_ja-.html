<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCS_software | Portal Oficial</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #b91c1c; /* VERMELHO FERRARI ELEGANTE */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0; padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #991b1b;
            padding: 40px;
            border: 3px solid #facc15; /* BORDA DOURADA PREMIO */
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .bloco-logos { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .logo-maos-azuis { width: 85px; height: auto; }
        h1 { font-size: 32px; font-weight: 900; margin: 0 0 10px 0; letter-spacing: 1.5px; text-transform: uppercase; }
        .slogan { color: #4ade80; font-size: 14px; font-weight: bold; margin-bottom: 30px; text-transform: uppercase; }
        
        .status-bar {
            background: #000000;
            border: 1px solid #facc15;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .bloco-botoes-mestre { display: flex; flex-direction: column; gap: 14px; }
        .btn-mestre {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        .btn-mestre:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="container">
    <div class="bloco-logos">
        <img src="https://imgur.com" class="logo-maos-azuis" alt="Acordo de Confiança">
    </div>

    <h1>Olá!</h1>
    <h2>JCS_software</h2>
    <div class="slogan">"Não estamos vendendo nada, estamos te dando crédito"</div>
    
    <div class="status-bar">
        🤝 Acordo de Confiança Garantido<br>
        <span style="font-size: 11px; color: #4ade80; display: block; margin-top: 5px;">● TERMINAL RESTRITO E ATIVO</span>
    </div>

    <!-- 🎯 BOTÕES COM DIRECIONAMENTO FÍSICO DIRETO PARA CHAMAR AS PRÓXIMAS TELAS ISOLADAS -->
    <div class="bloco-botoes-mestre">
        <button class="btn-mestre" style="background-color: #facc15; color: #000000;" onclick="chamarTelaIsolada('BOLETO')">1. Ver Boleto / QR Code Bradesco ➔</button>
        <button class="btn-mestre" style="background-color: #22c55e; color: #ffffff;" onclick="chamarTelaIsolada('DUPLICATA')">2. Ver Cupom de Duplicata Verde ➔</button>
    </div>
</div>

<script>
    function chamarTelaIsolada(destino) {
        // Envia fisicamente o comando de salto para abrir os arquivos independentes da nuvem
        let paginaAlvo = (destino === 'BOLETO') ? "index6.html" : "index2.html";
        window.location.href = paginaAlvo;
    }
</script>
</body>
</html>
