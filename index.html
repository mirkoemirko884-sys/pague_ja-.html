<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCS_software | Terminal Digital Ativo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #cc092f; /* VERMELHO RESTRITO */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #cc092f;
            padding: 30px;
            border: 2px solid #ffffff;
            border-radius: 12px;
            width: 100%;
            max-width: 460px;
            text-align: center;
        }
        .logo-parceria {
            width: 110px;
            height: auto;
            margin-bottom: 12px;
        }
        h2 { font-size: 26px; margin: 0 0 5px 0; font-weight: bold; letter-spacing: 1px; }
        .slogan { color: #5eff5e; font-size: 13px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .status-bar {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            padding: 8px;
            font-size: 11px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .badge-shopee { background-color: #ff4500; color: white; font-size: 9px; font-weight: bold; padding: 3px 6px; border-radius: 3px; text-transform: uppercase; }
        .badge-ml { background-color: #fff159; color: #333333; font-size: 9px; font-weight: bold; padding: 3px 6px; border-radius: 3px; text-transform: uppercase; }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-bottom: 15px;
        }
        label { font-size: 11px; font-weight: bold; display: block; margin-bottom: 6px; text-transform: uppercase; }
        
        .input-vip {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            color: #000000;
            background-color: #ffffff;
            border: none;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .input-valor {
            width: 100%;
            padding: 12px;
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            background-color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 15px;
        }

        .tarja-cadeado {
            background: #000000;
            color: #ff3333;
            border: 1px solid #ff3333;
            font-size: 10px;
            font-family: monospace;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 5px;
            text-align: justify;
            line-height: 1.4;
        }

        .btn-portal {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #25d366; /* VERDE WHATSAPP */
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="png" class="logo-parceria" onerror="this.src='https://imgur.com'" alt="Logo JCS_software">
    
    <h2>JCS_software</h2>
    <div class="slogan">"Não estamos vendendo nada, estamos te dando crédito"</div>
    
    <div class="status-bar">
        <span class="badge-shopee">⚡ VENDEDOR INDICADO</span>
        <span class="badge-ml">✔ LOJA OFICIAL</span>
    </div>
    
    <div class="login-box">
        <div class="status-bar" style="margin-bottom: 15px; background: rgba(0,0,0,0.4);">
            <span>● Terminal Digital Ativo</span>
            <span id="relogioDigital">15/10/2026</span>
        </div>

        <label>Digite o Valor do Faturamento (R$):</label>
        <input type="number" class="input-valor" id="txtValorLancado" placeholder="0,00" step="0.01" min="2.00" value="60.00">
        
        <label>Descrição do Produto / Insumo:</label>
        <input type="text" class="input-vip" id="txtDescLancada" value="manutenção de JCS_suguimoto mensal">

        <label>NOME DO PROPRIETÁRIO (VALIDADOR):</label>
        <input type="text" class="input-vip" id="txtLojista" value="RODRIGO" readonly>
        
        <label>NOME DO ESTABELECIMENTO MERCANTIL:</label>
        <input type="text" class="input-vip" id="txtEstablishment" value="MAIRIPORÃ RAÇÕES" readonly>
        
        <div class="tarja-cadeado">
            🔒 [SINAL LOCK: FECHAMENTO DE SEGURANÇA ATIVO]<br>
            PROIBIDA ESTRITAMENTE A REPRODUÇÃO, CÓPIA, ENGENHARIA REVERSA NÃO AUTORIZADA POR TERCEIROS.
        </div>
    </div>

    <button class="btn-portal" onclick="gerarCobrancaInstantanea()">Gerar Cobrança Instantânea ➔</button>
</div>

<script>
    // 🎯 O GATILHO COMPORTAMENTAL MESTRE: PEGA O ENDEREÇO DA INTERNET DE FORMA AUTOMÁTICA CONTRA DOWNLOADS LOCAIS
    function gerarCobrancaInstantanea() {
        const valor = parseFloat(document.getElementById('txtValorLancado').value) || 0.00;
        
        if (valor < 2.00) {
            alert("❌ OPERAÇÃO RECUSADA: O valor mínimo protocolar para faturamento no JCS_software é de R$: 2,00!");
            return;
        }

        // Descobre se está abrindo local ou na nuvem e monta a rota perfeita da página de internet index6.html
        let urlAtual = window.location.href;
        let baseRoteamento = "";
        
        if (urlAtual.includes("index.html")) {
            baseRoteamento = urlAtual.replace("index.html", "index6.html");
        } else if (urlAtual.endsWith("/")) {
            baseRoteamento = urlAtual + "index6.html";
        } else {
            baseRoteamento = "index6.html";
        }

        window.location.href = baseRoteamento + "?valor=" + valor;
    }

    function atualizarRelogio() {
        const agora = new Date();
        const dia = String(agora.getDate()).padStart(2, '0');
        const mes = String(agora.getMonth() + 1).padStart(2, '0');
        const ano = agora.getFullYear();
        document.getElementById('relogioDigital').innerText = dia + "/" + mes + "/" + ano + " - " + String(agora.getHours()).padStart(2, '0') + ":" + String(agora.getMinutes()).padStart(2, '0') + ":" + String(agora.getSeconds()).padStart(2, '0');
    }
    
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();
</script>
</body>
</html>
