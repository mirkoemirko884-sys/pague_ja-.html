<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro | Seleção de Combos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #cc092f; /* IDENTIDADE VERMELHA RESTRITA */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #cc092f;
            padding: 30px;
            border: 2px solid #ffffff;
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 { color: #ffffff; margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: #f1f5f9; font-size: 14px; margin-bottom: 15px; opacity: 0.9; }
        
        .status-bar {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge-online {
            background-color: #5eff5e;
            color: #000000;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 10px;
            text-transform: uppercase;
        }

        .opcoes-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-bottom: 20px;
        }
        .radio-group {
            margin-bottom: 22px;
            display: flex;
            align-items: flex-start;
            cursor: pointer;
        }
        .radio-group:last-child { margin-bottom: 0; }
        .radio-group input {
            margin-top: 4px;
            margin-right: 14px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .label-texto { font-size: 16px; color: #ffffff; line-height: 1.4; }
        .preco-destaque { font-weight: bold; text-decoration: underline; }
        .desconto-tag {
            display: block;
            font-size: 13px;
            color: #5eff5e;
            font-weight: bold;
            margin-top: 2px;
        }
        .total-box {
            margin-top: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid #ffffff;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
        }
        .total-value { font-weight: bold; font-size: 22px; }
        .btn-avancar {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #cc092f;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-top: 20px;
            transition: background 0.2s;
            box-sizing: border-box;
        }
        .btn-avancar:hover { background-color: #f1f5f9; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mairiporã Agro</h2>
    <div class="subtitle">Painel de Romaneio — Laboratório JCS_software</div>
    
    <div class="status-bar">
        <span class="badge-online">● Sistema On-line</span>
        <span id="relogioDigital">Carregando data...</span>
    </div>
    
    <div class="opcoes-box">
        <label class="radio-group">
            <input type="radio" name="opcaoOvos" value="13.00" checked onchange="atualizarTotal('1 Cartela (30un) - R\$: 13,00', 'Sem desconto')">
            <span class="label-texto">
                Se levar <strong>1 Cartela</strong> (30 un) ➔ sai por <span class="preco-destaque">R\$: 13,00</span>
                <span class="desconto-tag" style="color: #e2e8f0; font-weight: normal; opacity: 0.7;">Preço regular por volume</span>
            </span>
        </label>
        
        <label class="radio-group">
            <input type="radio" name="opcaoOvos" value="24.00" onchange="atualizarTotal('2 Cartelas (60un) - R\$: 24,00', 'Economia de R\$: 2,00')">
            <span class="label-texto">
                Se levar <strong>2 Cartelas</strong> (60 un) ➔ ganha bônus e sai por <span class="preco-destaque">R\$: 24,00</span>
                <span class="desconto-tag">★ Você ganha R\$: 2,00 de desconto comercial! (R\$: 12,00 cada)</span>
            </span>
        </label>
        
        <label class="radio-group">
            <input type="radio" name="opcaoOvos" value="33.00" onchange="atualizarTotal('3 Cartelas (90un) - R\$: 33,00', 'Economia de R\$: 6,00')">
            <span class="label-texto">
                Se levar <strong>3 Cartelas</strong> (90 un) ➔ super bônus e sai por <span class="preco-destaque">R\$: 33,00</span>
                <span class="desconto-tag">★★ Você ganha R\$: 6,00 de desconto comercial! (R\$: 11,00 cada)</span>
            </span>
        </label>
    </div>

    <div class="total-box">
        <span>Faturamento Selecionado:</span>
        <span id="valorTotalExibido" class="total-value">R\$: 13,00</span>
    </div>

    <button class="btn-avancar" onclick="avancarParaFaturamento()">Gerar e Enviar Faturamento</button>
</div>

<script>
    let 'descricaoSelecionada' = "1 Cartela (30un) - R\$: 13,00";
    let 'descontoTexto' = "Sem desconto";

    function atualizarTotal(descricao, desconto) {
        const preco = document.querySelector('input[name="opcaoOvos"]:checked').value;
        descricaoSelecionada = descricao;
        descontoTexto = desconto;
        document.getElementById('valorTotalExibido').innerText = `R$: ${preco.replace('.', ',')}`;
    }

    function avancarParaFaturamento() {
        const preco = document.querySelector('input[name="opcaoOvos"]:checked').value;
        // DIRECIONAMENTO CIRÚRGICO PARA O INDEX4 DO NOVO REPOSITÓRIO
        window.location.href = "index4.html?valor=" + preco + "&desc=" + encodeURIComponent(descricaoSelecionada) + "&desconto=" + encodeURIComponent(descontoTexto);
    }

    function atualizarRelogio() {
        const agora = new Date();
        const dia = String(agora.getDate()).padStart(2, '0');
        const mes = String(agora.getMonth() + 1).padStart(2, '0');
        const ano = agora.getFullYear();
        const horas = String(agora.getHours()).padStart(2, '0');
        const minutos = String(agora.getMinutes()).padStart(2, '0');
        const segundos = String(agora.getSeconds()).padStart(2, '0');
        document.getElementById('relogioDigital').innerText = `${dia}/${mes}/${ano} - ${horas}:${minutos}:${segundos}`;
    }
    
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();
</script>
</body>
</html>
