<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCS_software | Cadastro de Lojas Oficiais</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #cc092f; /* VERMELHO RESTRITO */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #cc092f;
            padding: 30px;
            border: 2px solid #ffffff;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { font-size: 26px; margin-bottom: 5px; font-weight: bold; }
        .slogan { color: #5eff5e; font-size: 13px; font-weight: bold; margin-bottom: 20px; text-transform: uppercase; }
        
        .status-bar {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            padding: 8px;
            font-size: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }
        
        /* SELOS ESTILO SHOPEE / MERCADO LIVRE */
        .badge-shopee {
            background-color: #ff4500; /* Laranja Shopee */
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }
        .badge-ml {
            background-color: #fff159; /* Amarelo ML */
            color: #333333;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffffff;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-bottom: 15px;
        }
        .input-vip {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            color: #000000;
            background-color: #ffffff;
            border: none;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .btn-portal {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #5eff5e;
            color: #000000;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>JCS_software</h2>
    <div class="slogan">"Não estamos vendendo nada, estamos te dando crédito"</div>
    
    <div class="status-bar">
        <span class="badge-shopee">⚡ VENDEDOR INDICADO</span>
        <span class="badge-ml">✔ LOJA OFICIAL</span>
    </div>
    
    <div class="login-box">
        <label style="font-size: 13px; font-weight: bold;">NOME DO PROPRIETÁRIO (VALIDADOR):</label>
        <input type="text" class="input-vip" id="txtLojista" value="RODRIGO">
        
        <label style="font-size: 13px; font-weight: bold;">NOME DO ESTABELECIMENTO MERCANTIL:</label>
        <input type="text" class="input-vip" id="txtEstabelecimento" value="MAIRIPORÃ RAÇÕES">
        
        <div style="font-size: 11px; opacity: 0.8; text-align: justify; line-height: 1.4;">
            🔒 <strong>GARANTIA DE CONTA PROTEGIDA:</strong> Este terminal ativa a emissão de cupons de crédito e recebíveis direto em carteira local com taxa zero de intermediação.
        </div>
    </div>

    <button class="btn-portal" onclick="ativarLojaIndicada()">Ativar Loja Indicada ➔</button>
</div>

<script>
    function activarLojaIndicada() {
        const lojista = document.getElementById('txtLojista').value.trim();
        const loja = document.getElementById('txtEstabelecimento').value.trim();
        window.location.href = `index3.html?parceiro=${encodeURIComponent(lojista)}&loja=${encodeURIComponent(loja)}`;
    }
</script>
</body>
</html>
